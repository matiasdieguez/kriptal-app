  <noscript>
    <section class="noscript-seo">
      <h1>Private, local-first encrypted messaging</h1>
      <p>Kriptal is an offline-first encrypted messaging PWA. Create a local identity, exchange public keys, encrypt a message for a contact, and share it as a file. There is no server inbox or message relay.</p>
      <p>Messages use hybrid P-256 and ML-KEM-768 encryption with ML-DSA-65 sender authentication. Enable JavaScript to create or unlock your local vault and use Kriptal.</p>
    </section>
