    <text x="310" y="157" font-size="14" font-weight="700">INSTALL APP</text>
    <text x="500" y="157" font-size="14" font-weight="700">OPEN KRIPTAL</text>
  </g>
  <g fill="#a1afa5" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="120" y="220">1</text><text x="310" y="220">2</text><text x="500" y="220">3</text>
